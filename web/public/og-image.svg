<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B3261E" />
      <stop offset="100%" stop-color="#8B1D1D" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#EAD8C7" stroke-width="2" />
  
  <!-- Brand Seal -->
  <g transform="translate(100, 120)">
    <rect width="90" height="90" rx="22" fill="url(#redGrad)" />
    <text x="45" y="62" font-family="serif" font-size="52" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L</text>
  </g>
  
  <!-- Main Title -->
  <text x="210" y="165" font-family="Plus Jakarta Sans, sans-serif" font-size="44" font-weight="900" fill="#1E293B" letter-spacing="-1">LỊCH AN NHIÊN</text>
  <text x="212" y="200" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="600" fill="#B3261E">lichannhien.com • Lịch Âm Dương &amp; Lịch Vạn Niên Việt Nam</text>
  
  <!-- Hero Catchphrase & Keywords -->
  <text x="100" y="300" font-family="Noto Serif, serif" font-size="52" font-weight="bold" fill="#8B1D1D">Hôm Nay Ngày Mấy? Lịch Âm Dương Hôm Nay</text>
  <text x="100" y="360" font-family="Plus Jakarta Sans, sans-serif" font-size="24" fill="#475569" font-weight="500">Xem ngày tốt xấu • 12 Giờ hoàng đạo • Can Chi • Tiết khí • Đổi ngày Âm Dương</text>
  
  <!-- Feature Badges -->
  <g transform="translate(100, 420)">
    <rect width="210" height="60" rx="14" fill="#FFEBEE" stroke="#FFCDD2" />
    <text x="105" y="37" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700" fill="#B3261E" text-anchor="middle">Lịch Âm Bính Ngọ</text>
  </g>
  
  <g transform="translate(330, 420)">
    <rect width="220" height="60" rx="14" fill="#E8F5E9" stroke="#C8E6C9" />
    <text x="110" y="37" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700" fill="#198754" text-anchor="middle">Giờ Hoàng Đạo Thực</text>
  </g>
  
  <g transform="translate(570, 420)">
    <rect width="250" height="60" rx="14" fill="#FFF3E0" stroke="#FFE0B2" />
    <text x="125" y="37" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700" fill="#E65100" text-anchor="middle">Chuẩn Hồ Ngọc Đức</text>
  </g>

  <g transform="translate(840, 420)">
    <rect width="260" height="60" rx="14" fill="#EDE7F6" stroke="#D1C4E9" />
    <text x="130" y="37" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700" fill="#5E35B1" text-anchor="middle">100% Không Quảng Cáo</text>
  </g>

  <!-- Footer Website Domain -->
  <text x="100" y="550" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="600" fill="#94A3B8">Website chính thức: https://lichannhien.com</text>
</svg>
